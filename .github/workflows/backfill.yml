name: Import historii cen

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Od (RRRR-MM-DD, najwcześniej 2024-02-08)"
        default: "2024-02-08"
      end:
        description: "Do (RRRR-MM-DD, puste = wczoraj)"
        default: ""
      every:
        description: "Co ile dni brać archiwum"
        default: "7"
  push:                     # tymczasowo: import z gałęzi roboczej (usunąć przed scaleniem)
    branches: [tcgcsv-history]
    paths: [".github/workflows/backfill.yml"]

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Katalog (tylko jeśli go brak – tcgcsv prosi o jedno pobranie dziennie)
        run: test -f data/catalog/cards.csv || python scripts/collect_prices.py
      - name: Import z kopii archiwum na GitHubie (pokefolio-data)
        timeout-minutes: 100
        run: |
          args="--source github --start ${{ inputs.start || '2024-02-08' }} --every ${{ inputs.every || '7' }}"
          if [ -n "${{ inputs.end }}" ]; then args="$args --end ${{ inputs.end }}"; fi
          python scripts/backfill_history.py $args
      - name: Zapisz dane w repo
        if: always()
        run: |
          git config user.name "pokescout-bot"
          git config user.email "pokescout-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Historia cen z kopii archiwum tcgcsv"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
