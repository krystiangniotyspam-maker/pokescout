name: Codzienne ceny

on:
  schedule:
    - cron: "17 5 * * *"   # codziennie 5:17 UTC (7:17 latem, 6:17 zimą czasu polskiego)
  workflow_dispatch:        # ręczne uruchomienie z zakładki Actions

permissions:
  contents: write

concurrency:               # jeden zapis do repo naraz (codzienny przebieg i import historii)
  group: data-write
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Zbierz ceny (tcgcsv.com)
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/collect_prices.py
      - name: Zapisz dane w repo
        run: |
          git config user.name "pokescout-bot"
          git config user.email "pokescout-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Ceny $(date -u +%F)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
