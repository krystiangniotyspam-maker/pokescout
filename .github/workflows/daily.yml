name: Codzienne ceny i raport

on:
  schedule:
    - cron: "17 5 * * *"   # codziennie ok. 7:17 czasu polskiego (latem)
  workflow_dispatch:        # ręczne uruchomienie z zakładki Actions

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Zbierz ceny
        env:
          POKEMONTCG_API_KEY: ${{ secrets.POKEMONTCG_API_KEY }}
        run: python scripts/collect_prices.py
      - name: Zapisz dane w repo
        run: |
          git config user.name "pokescout-bot"
          git config user.email "pokescout-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Ceny $(date -u +%F)"
          git push
      - name: Raport
        env:
          DISCORD_WEBHOOK_RAPORT: ${{ secrets.DISCORD_WEBHOOK_RAPORT }}
        run: python scripts/report.py --send
