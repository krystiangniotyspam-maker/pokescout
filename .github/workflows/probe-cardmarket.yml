name: Diagnoza Cardmarket (tymczasowe)
on:
  push:
    branches: [more-signals]
    paths: [".github/workflows/probe-cardmarket.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pandas requests
      - run: python scripts/collect_cardmarket.py
      - run: |
          git config user.name "pokescout-bot"
          git config user.email "pokescout-bot@users.noreply.github.com"
          git add data/cardmarket
          git commit -m "Ceny Cardmarket (pierwszy zrzut)"
          git push origin HEAD:more-signals
