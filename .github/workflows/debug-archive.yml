name: Diagnoza kopii archiwum (tymczasowe)

on:
  push:
    branches: [tcgcsv-history]
    paths: [".github/workflows/debug-archive.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Kandydaci
        run: |
          for R in sodennis/cardarchive-tcgcsv landonrroy/pokefolio-data Tbaker-maker/Catchem-data RubyCollecting/cardvault-data brentsharon/pokesave-data tcgdex/price-history; do
            info=$(gh api "repos/$R" --jq '"size=\(.size)KB pushed=\(.pushed_at) branch=\(.default_branch) desc=\(.description)"' 2>&1 | head -c 250)
            rel=$(gh api "repos/$R/releases?per_page=3" --jq '[.[] | "\(.tag_name)[\([.assets[].name] | join("+"))]"] | join(" ")' 2>&1 | head -c 250)
            tree=$(gh api "repos/$R/contents" --jq '[.[] | .name] | join(" ")' 2>&1 | head -c 250)
            echo "::notice title=$R::$info | releases: $rel | root: $tree"
          done
