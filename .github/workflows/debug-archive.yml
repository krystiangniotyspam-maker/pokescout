name: Diagnoza archiwum tcgcsv (tymczasowe)

on:
  push:
    branches: [tcgcsv-history]
    paths: [".github/workflows/debug-archive.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pełna treść odpowiedzi
        run: |
          curl -sS https://tcgcsv.com/archive/tcgplayer/prices-2025-06-01.ppmd.7z -o /tmp/b || true
          tr -d '\r' < /tmp/b | tr '\n' ' ' | fold -w 240 | while read -r l; do echo "::notice title=body::$l"; done
