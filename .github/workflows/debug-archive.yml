name: Diagnoza kopii archiwum (tymczasowe)

on:
  push:
    branches: [tcgcsv-history]
    paths: [".github/workflows/debug-archive.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: pokefolio-data
        run: |
          R=landonrroy/pokefolio-data
          gh api "repos/$R/readme" --jq .content | base64 -d | tr '\n' ' ' | fold -w 300 | head -12 | while read -r l; do echo "::notice title=readme::$l"; done
          gh api "repos/$R/contents/data" --jq '[.[] | "\(.name)(\(.type))"] | join(" ")' | head -c 900 | while read -r l; do echo "::notice title=data::$l"; done
          sub=$(gh api "repos/$R/contents/data" --jq '.[0].name')
          gh api "repos/$R/contents/data/$sub" --jq '[.[] | "\(.name)(\(.type),\(.size))"] | join(" ")' | head -c 900 | while read -r l; do echo "::notice title=data/$sub::$l"; done
          gh api "repos/$R/commits?per_page=3" --jq '.[] | "\(.commit.author.date) \(.commit.message | split("\n")[0])"' | while read -r l; do echo "::notice title=commits::$l"; done
      - name: tcgdex
        run: |
          R=tcgdex/price-history
          gh api "repos/$R/contents/en" --jq '[.[] | .name] | join(" ")' | head -c 600 | while read -r l; do echo "::notice title=tcgdex-en::$l"; done
          gh api "repos/$R/contents/meta" --jq '[.[] | .name] | join(" ")' | head -c 600 | while read -r l; do echo "::notice title=tcgdex-meta::$l"; done
