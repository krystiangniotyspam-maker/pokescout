name: Nazwy kart z PriceCharting (jednorazowo)

on:
  push:
    branches: [pc-history]
    paths: [scripts/collect_pricecharting_names.py, .github/workflows/pc-names.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pandas requests
      - run: python scripts/collect_pricecharting_names.py --debug
      - name: Zapisz w repo
        if: always()
        run: |
          git config user.name "pokescout-bot"
          git config user.email "pokescout-bot@users.noreply.github.com"
          git add data/history
          git diff --cached --quiet && exit 0
          git commit -m "Nazwy kart z PriceCharting"
          git push origin HEAD:"$GITHUB_REF_NAME"
